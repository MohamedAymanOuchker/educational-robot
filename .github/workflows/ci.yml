name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  firmware:
    name: Firmware (PlatformIO build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio==6.1.18

      - name: Firmware host regression tests
        run: python firmware/test/host/run_tests.py

      - name: Build firmware
        working-directory: firmware
        run: pio run

  app:
    name: Mobile app (analyze, test, Android packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.4"

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Install pinned Android components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile-app
        run: flutter test

      - name: Build Android debug APK
        working-directory: mobile-app
        run: flutter build apk --debug --no-pub

      - name: Require signing for normal release builds
        working-directory: mobile-app
        shell: bash
        run: |
          if (cd android && ./gradlew :app:preReleaseBuild --console=plain > ../build/release-signing-check.log 2>&1); then
            echo "Release validation unexpectedly accepted missing signing credentials."
            exit 1
          fi
          grep -F "Release signing is not configured" build/release-signing-check.log

      - name: Compile unsigned release APK and app bundle
        working-directory: mobile-app
        env:
          ROBOCODE_UNSIGNED_RELEASE: "true"
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Verify packaged identities, permissions and signing states
        working-directory: mobile-app
        run: python tool/verify_android_artifacts.py --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Keep supervised-test APK
        uses: actions/upload-artifact@v4
        with:
          name: robocode-debug-${{ github.sha }}
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
